## Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: bootstrap5

---
## Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bootstrap5-deployment
  namespace: bootstrap5

spec:
  replicas: 3

  ## RollingUpdate Strategy: Gradually Replaced Pods
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: bootstrap5

  template:
    metadata:
      labels:
        app: bootstrap5

    spec:

      ## High Availability: Spreads Pods/Replicas Across Nodes to Eliminate Single-Node Failure Points (Best Effort)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - bootstrap5
                topologyKey: "kubernetes.io/hostname"

      ## Red Hat UBI-Minimal for the Git Operations/initContainers
      initContainers:
        - name: ubi9-minimal
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command: ["/bin/sh", "-c"]

          args:
            - |
              microdnf install -y git-core
              ## Clone into Red Hat S2I Directory
              git clone https://github.com/cjstrych/bootstrap5 /opt/app-root/src
              ## Fix Permissions for the UBI NON-ROOT User (1001)
              chown -R 1001:0 /opt/app-root/src
              chmod -R g+rwX /opt/app-root/src

          volumeMounts:
            - name: content
              mountPath: /opt/app-root/src

      containers:
        - name: ubi9-php82
          image: registry.access.redhat.com/ubi9/php-82:latest

          ## Start the Apache/PHP Process via Red Hat Source-to-Image (S2I)
          command: ["/usr/libexec/s2i/run"]

          ports:
            - containerPort: 8080

          ## Health/Liveness Probe
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20

          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"

          volumeMounts:
            - name: content
              mountPath: /opt/app-root/src

      volumes:
        - name: content
          emptyDir: {}

---
## Service
apiVersion: v1
kind: Service
metadata:
  name: bootstrap5-service
  namespace: bootstrap5

spec:
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP

  selector:
    app: bootstrap5

---
## HAProxy Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bootstrap5-ingress
  namespace: bootstrap5

  annotations:
    haproxy.org/check: "true"

spec:
  ingressClassName: haproxy

  rules:
    - host: bootstrap5.cluster.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bootstrap5-service
                port:
                  number: 80

---
## HorizontalPodAutoscaler with CPU and Memory Resources
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bootstrap5-autoscaler
  namespace: bootstrap5

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bootstrap5-deployment

  minReplicas: 2
  maxReplicas: 10

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50

    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 50

---
## PodDisruptionBudget to Ensure Availability During Node Maintenance
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bootstrap5-pdb
  namespace: bootstrap5

spec:
  minAvailable: 2

  selector:
    matchLabels:
      app: bootstrap5
